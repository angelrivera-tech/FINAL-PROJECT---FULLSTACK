<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Worldnews</title>
    <link rel="stylesheet" href="../css/style5.css">
</head>
<body>
    <header><h1>Worldnews</h1></header>

    <div class="navigation-links">
        <a href="../pages/index.html">home</a>
        <a href="../pages/about us.html">about us</a> 
        <a href="../pages/subscriptions.html">donations</a> 
        <a href="../pages/contact us.html">contact us</a> 
        <a href="../pages/sign in.html">sign in</a>
    </div>

    <form id="registerForm">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        <input type="submit" value="Sign In">
    </form> 

    <footer>
        <h1>Angel Gabriel Rivera Resto was here</h1>
        <h2>All rights reserved to Worldnews &copy;</h2>   
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    alert('¡Registro exitoso! Ahora puedes iniciar sesión.');
                    window.location.href = '../pages/log in.html';
                } else {
                    alert(data.error || 'Error al registrar el usuario');
                }
            } catch (err) {
                console.error('Error:', err);
                alert('No se pudo conectar con el servidor backend.');
            }
        });
    </script>
</body>
</html>
